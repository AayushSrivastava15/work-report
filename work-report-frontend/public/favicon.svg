<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="wpHexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#06b6d4" />
      <stop offset="50%" stopColor="#3b82f6" />
      <stop offset="100%" stopColor="#8b5cf6" />
    </linearGradient>
    <linearGradient id="wpPulseGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="50%" stopColor="#06b6d4" />
      <stop offset="100%" stopColor="#a855f7" />
    </linearGradient>
    <linearGradient id="wpBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0f172a" />
      <stop offset="100%" stopColor="#020617" />
    </linearGradient>
    <filter id="wpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="64" height="64" rx="16" fill="url(#wpBgGrad)" />

  <!-- Outer Hexagonal Frame -->
  <path
    d="M 32 8 L 52 19.5 L 52 44.5 L 32 56 L 12 44.5 L 12 19.5 Z"
    stroke="url(#wpHexGrad)"
    stroke-width="3.5"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Glowing Pulse + Checkmark Wave -->
  <path
    d="M 6 32 L 18 32 L 23 43 L 30 19 L 36 38 L 56 16"
    stroke="url(#wpPulseGrad)"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#wpGlow)"
  />

  <!-- Core White Highlight Point -->
  <circle cx="30" cy="19" r="1.5" fill="#ffffff" />
  <circle cx="56" cy="16" r="1.75" fill="#ffffff" />
</svg>