spring.application.name=work-report-backend

# Database Configuration (Environment variables with safe defaults)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/work_report_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Admin123$}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=${PORT:8080}

# JWT Security Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Resend Transactional Email Configuration
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}
resend.from-name=${RESEND_FROM_NAME:Work Report}
resend.reply-to=${RESEND_REPLY_TO:}
resend.enabled=${RESEND_ENABLED:true}
app.base-url=${APP_BASE_URL:http://localhost:5173}