spring.application.name=work-report-backend

# Database Configuration (Environment variables with safe defaults)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/work_report_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Admin123$}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=${PORT:8080}