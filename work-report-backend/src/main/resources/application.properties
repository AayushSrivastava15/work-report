spring.application.name=work-report-backend

# Database Configuration (Environment variables with safe defaults)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/work_report_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Admin123$}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=${PORT:8080}

# JWT Security Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Mail & SMTP Configuration (Mailpit default: localhost:1025)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# App Sender Details
app.mail.from=${MAIL_FROM:noreply@workreport.local}
app.mail.from-name=${MAIL_FROM_NAME:Work Report}
app.mail.reply-to=${MAIL_REPLY_TO:}
app.mail.enabled=${MAIL_ENABLED:true}
app.base-url=${APP_BASE_URL:http://localhost:5173}